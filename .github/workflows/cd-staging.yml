name: CD - Staging

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  deploy-stage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        run: echo "TAG=stage-${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tests run in the CI workflow on the same push; the Dockerfile compiles the TypeScript.
      - name: Build collaboration image
        run: |
          docker build -t ghcr.io/$IMAGE_NAME/collaboration:$TAG .
          docker push ghcr.io/$IMAGE_NAME/collaboration:$TAG

      # Backend and frontend are deployed from their own repositories, so only the collaboration
      # tag is replaced and only the collaboration service is restarted. Its Keycloak client secret
      # comes from the server's env file.
      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGE_SSH_HOST }}
          username: ${{ secrets.STAGE_SSH_USER }}
          key: ${{ secrets.STAGE_SSH_KEY }}
          script: |
            set -e
            cd /opt/methodologist
            touch .deploy.env
            sed -i '/^COLLABORATION_IMAGE_TAG=/d' .deploy.env
            echo "COLLABORATION_IMAGE_TAG=${{ env.TAG }}" >> .deploy.env
            docker compose --env-file .deploy.env pull collaboration
            docker compose --env-file .deploy.env up -d collaboration
