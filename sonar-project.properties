# Mandatory configuration
sonar.projectKey=vitruv-tools_Methodologist-CollaborationService
sonar.organization=vitruv-tools
sonar.host.url=https://sonarcloud.io

# Source, test and coverage paths
sonar.sources=src
sonar.tests=test
sonar.exclusions=**/node_modules/**,src/types/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Entry point that only wires config and server together; covered by the Docker check in CI
sonar.coverage.exclusions=src/index.ts
